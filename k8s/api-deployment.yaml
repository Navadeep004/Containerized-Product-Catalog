apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-api
  namespace: product-catalog

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-api

  template:
    metadata:
      labels:
        app: product-api

    spec:
      containers:
        - name: product-api
          image: navadeep04/product-catalog-api:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: product-api-secret
                  key: MONGO_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5