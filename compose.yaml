services:

  api:
    build: .
    container_name: product-api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: product-mongodb
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: